<script src="js/fundo.js" defer></script>
<script src="js/auth.js" defer></script>

<script src="js/admin-galeria.js" defer></script>
<script src="js/admin-fim.js" defer></script>

<div class="wrap">

<div id="admin-login" class="sticker login-box">
  <h1>Painel da Anne</h1>
  <p>Entra com o email e a senha da sua conta pra editar o site.</p>
  <form id="login-form">
    <div class="campo">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="login-senha">Senha</label>
      <input type="password" id="login-senha" autocomplete="current-password" required>
    </div>
    <p class="erro" id="login-erro" hidden></p>
    <button class="cta" type="submit" id="login-botao" style="width:100%;margin-top:6px">Entrar</button>
  </form>
</div>

<div id="admin-painel" hidden>
  <div class="admin-topo">
    <h1>Painel da Anne</h1>
    <button class="sair" type="button" id="sair-botao">Sair</button>
  </div>

  <div class="tabs admin-abas" role="tablist" aria-label="Seção do painel">
    <button class="tab" type="button" role="tab" aria-selected="true"  data-aba="precos">Preços &amp; Perfil</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-aba="cenarios">Cenários</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-aba="galeria">Galeria</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-aba="fim">Fim Anti-Herói</button>
  </div>

  <div id="aba-precos"></div>
  <div id="aba-cenarios" hidden></div>
  <div id="aba-galeria" hidden></div>
  <div id="aba-fim" hidden></div>
</div>

</div>
